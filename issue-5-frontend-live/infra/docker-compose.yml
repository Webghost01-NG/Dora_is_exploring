version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: dora-explorer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: explorer
    ports:
      - "5432:5432"
    volumes:
      - dora_pgdata:/var/lib/postgresql/data

volumes:
  dora_pgdata:
